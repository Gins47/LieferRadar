services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: lieferrader-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password_123
      POSTGRES_DB: lieferrader_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
