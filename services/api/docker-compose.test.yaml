services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${LIEFERRADAR_TEST_DB_USER:?set by the integration test runner}
      POSTGRES_PASSWORD: ${LIEFERRADAR_TEST_DB_PASSWORD:?set by the integration test runner}
      POSTGRES_DB: ${LIEFERRADAR_TEST_DB_NAME:?set by the integration test runner}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
